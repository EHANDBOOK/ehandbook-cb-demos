name: EHANDBOOK Container Request
description: Request creation of an EHANDBOOK Cloud Service demo container
title: "EHANDBOOK Container Request"
labels:
  - container-request

body:

  - type: markdown
    attributes:
      value: |
        ## EHANDBOOK Container Request

        Use this form to request creation of an EHANDBOOK Cloud Service
        demo container.

        The demo folder must exist in this repository.

  - type: input
    id: demo_folder
    attributes:
      label: Demo folder
      description: |
        Enter the path of the demo Input folder relative to the
        repository root.

      placeholder: "Demo_EHBCB_DirBased_AUTOSAR_SL_FlexECU/Input"

    validations:
      required: true

  - type: input
    id: config_file
    attributes:
      label: Configuration file
      description: |
        Optional configuration file path relative to the repository root.
        Leave empty if no configuration file is required.

      placeholder: "Demo_EHBCB_DirBased_AUTOSAR_SL_FlexECU/config.txt"

    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I confirm that the demo folder is a valid EHANDBOOK demo.
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        **Storage type and repository are managed by the workflow and
        cannot be changed through this request.**
