name: Create EHANDBOOK Cloud Service Demo Container via Trusted Service

on:
  repository_dispatch:
    types:
      - ehb-container-request

jobs:
  build:
    environment: ehb-container-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write # <-- Added permission to comment & close issues

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Authenticate and retrieve token
        id: auth
        uses: ./.github/actions/fetch-token
        with:
          client_id: ${{ secrets.DEMO_CLIENT_ID }}
          client_secret: ${{ secrets.DEMO_CLIENT_SECRET }}
          project_id: ${{ secrets.CLOUD_HUB_PROJECT_ID }}
          application_id: ${{ secrets.CLOUD_HUB_APPLICATION_ID }}
          auth_url: ${{ secrets.AUTH_URL }}

      - name: Update Issue Progress - Authenticated
        if: github.event.client_payload.issue_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const issueNumber = Number('${{ github.event.client_payload.issue_number }}');
            let jobUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              if (jobs.data.jobs.length > 0 && jobs.data.jobs[0].html_url) {
                jobUrl = jobs.data.jobs[0].html_url;
              }
            } catch (e) {}

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const artifact = artifacts.data.artifacts.find(item => item.name === 'EHANDBOOK Container');
            const artifactUrl = artifact
              ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`
              : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts`;

            const marker = '<!-- ehb-progress-tracker -->';
            const body = `${marker}
            [![Step](https://img.shields.io/badge/Step-Trigger_EHANDBOOK_API-007BC2?style=for-the-badge&logo=githubactions&logoColor=white)](${jobUrl})

            ⚙️ **Container Build In Progress...**

            - **Current Step:** Trigger EHANDBOOK API
            - **Job Console:** [View Live Logs & Output](${jobUrl})`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body
              });
            }

      - name: Trigger EHANDBOOK API
        id: build_step
        run: |
          TOKEN="${STEPS_AUTH_OUTPUTS_TOKEN}"
          CURL_CONNECT_TIMEOUT=30
          CURL_MAX_TIME=180

          ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

          update_issue_status() {
            local current_state="$1"
            if [ -z "${ISSUE_NUMBER:-}" ]; then return 0; fi

            local badge_state="${current_state//-/_}"
            local badge_url="https://img.shields.io/badge/Step-${badge_state}-007BC2?style=for-the-badge&logo=githubactions&logoColor=white"
            local job_url
            job_url=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[0].html_url // empty' 2>/dev/null || true)
            job_url="${job_url:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
            local marker="<!-- ehb-progress-tracker -->"

            local body="${marker}
            [![Step](${badge_url})](${job_url})

            ⚙️ **Container Build In Progress...**

            - **Current Step:** Trigger EHANDBOOK API (\`${current_state}\`)
            - **Task ID:** \`${task_id:-pending}\`
            - **Job Console:** [View Live Logs & Output](${job_url})"

            local comment_id
            comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id" 2>/dev/null | head -n 1 || true)

            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" > /dev/null 2>&1 || true
            fi
          }

          fetch_token() {
            local resp token
            echo "[$(ts)] Requesting refreshed auth token..." >&2
            resp=$(curl --location --request POST "$AUTH_URL" \
              --connect-timeout "$CURL_CONNECT_TIMEOUT" \
              --max-time "$CURL_MAX_TIME" \
              --silent --show-error \
              --header 'Content-Type: application/x-www-form-urlencoded' \
              --header 'accept: application/json' \
              --data-urlencode 'client_id=${{ secrets.DEMO_CLIENT_ID }}' \
              --data-urlencode 'client_secret=${{ secrets.DEMO_CLIENT_SECRET }}' \
              --data-urlencode 'grant_type=client_credentials' \
              --data-urlencode 'scope=${{ secrets.CLOUD_HUB_PROJECT_ID }}:${{ secrets.CLOUD_HUB_APPLICATION_ID }}')
            token=$(echo "$resp" | jq -er '.access_token | select(length > 0)')
            echo "::add-mask::$token" >&2
            printf '%s\n' "$token"
          }

          payload=$(jq -n \
            --arg taskType "CB" \
            --arg storageType "$GITHUB_EVENT_INPUTS_STORAGE_TYPE" \
            --arg storageUrl "$GITHUB_EVENT_INPUTS_STORAGE_URL" \
            --arg username "${{ secrets.GIT_USERNAME }}" \
            --arg password "${{ secrets.GIT_USER_PAT }}" \
            --arg inputObjectKey "$GITHUB_EVENT_INPUTS_DEMO_FOLDER" \
            --arg configurationObjectKey "$GITHUB_EVENT_INPUTS_CONFIG_FILE" \
            '{
                taskType: $taskType,
                storageType: $storageType,
                storageUrl: $storageUrl,
                storageCredentials: {
                  username: $username,
                  password: $password
                },
                inputObjectKey: $inputObjectKey
            } | if ($configurationObjectKey | length) > 0 then .configurationObjectKey = $configurationObjectKey else . end')

          echo "$payload"

          echo "[$(ts)] Triggering container-build API request..."
          response=$(curl --location --request POST "${{ secrets.DEMO_API_URL }}" \
            --connect-timeout "$CURL_CONNECT_TIMEOUT" \
            --max-time "$CURL_MAX_TIME" \
            --header "accept: application/json" \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/json" \
            --silent --show-error --write-out "HTTPSTATUS:%{http_code}" \
            --data "$payload")

          http_body="${response%HTTPSTATUS:*}"
          http_status="${response##*HTTPSTATUS:}"

          echo "body is $http_body"

          if [ "$http_status" -ne 202 ]; then
            echo "Error: Failed to trigger container generation. Status code: $http_status"
            exit 1
          fi

          container_resource=$(printf '%s' "$http_body" | jq -r '._links.self.href')
          task_id=$(printf '%s' "$http_body" | jq -r '.id')
          echo "Container Resource: $container_resource"

          token_fetched_at=$(date +%s)
          TOKEN_REFRESH_INTERVAL=540
          status="ACCEPTED"
          prev_status=""
          max_attempts=360
          attempt=0
          while [[ "$attempt" -lt "$max_attempts" && ( "$status" == "ACCEPTED" || "$status" == "MALWARE-SCANNING" || "$status" == "RUNNING" || "$status" == "DOWNLOADING" || "$status" == "QUEUED" ) ]]; do
            if [ "$status" != "$prev_status" ]; then
              echo "[$(ts)] Status changed to '$status' - updating issue status badge..."
              update_issue_status "$status"
              prev_status="$status"
            fi

            echo "Polling attempt $((attempt+1))..."
            sleep 30

            elapsed=$(( $(date +%s) - token_fetched_at ))
            if [ "$elapsed" -ge "$TOKEN_REFRESH_INTERVAL" ]; then
              echo "Refreshing access token (${elapsed}s elapsed since last fetch)..."
              TOKEN=$(fetch_token)
              token_fetched_at=$(date +%s)
            fi

            echo "[$(ts)] Polling container status from resource URL..."
            response=$(curl --location --request GET "$container_resource" \
              --connect-timeout "$CURL_CONNECT_TIMEOUT" \
              --max-time "$CURL_MAX_TIME" \
              --header 'accept: application/json' \
              --header "Authorization: Bearer $TOKEN" \
              --silent --show-error --write-out "HTTPSTATUS:%{http_code}")

            http_body="${response%HTTPSTATUS:*}"
            http_status="${response##*HTTPSTATUS:}"

            if [ "$http_status" -ne 200 ]; then
              echo "Error: Failed to get status. Status code: $http_status"
              exit 1
            fi

            status=$(printf '%s' "$http_body" | jq -r '.state')
            echo "Current status: $status"

            attempt=$((attempt+1))
          done

          case "$status" in
            FINISHED)
              ;;
            FAILED)
              echo "Container-build service reported FAILED."
              echo "$http_body"
              exit 1
              ;;
            *)
              echo "Container build timed out in state: $status"
              exit 1
              ;;
          esac

          echo "TASK_ID=$task_id" >> "$GITHUB_ENV"
          echo "SELF_HREF=$container_resource" >> "$GITHUB_ENV"
          echo "Job completed successfully."
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          STEPS_AUTH_OUTPUTS_TOKEN: ${{ steps.auth.outputs.token }}
          GITHUB_EVENT_INPUTS_STORAGE_TYPE: ${{ github.event.client_payload.storage_type }}
          GITHUB_EVENT_INPUTS_STORAGE_URL: ${{ github.event.client_payload.storage_url }}
          GITHUB_EVENT_INPUTS_DEMO_FOLDER: ${{ github.event.client_payload.demo_folder }}
          GITHUB_EVENT_INPUTS_CONFIG_FILE: ${{ github.event.client_payload.config_file }}

      - name: Update Issue Progress - Container Generated
        if: github.event.client_payload.issue_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const issueNumber = Number('${{ github.event.client_payload.issue_number }}');
            const taskId = '${{ env.TASK_ID }}';
            let jobUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              if (jobs.data.jobs.length > 0 && jobs.data.jobs[0].html_url) {
                jobUrl = jobs.data.jobs[0].html_url;
              }
            } catch (e) {}

            const marker = '<!-- ehb-progress-tracker -->';
            const body = `${marker}
            [![Step](https://img.shields.io/badge/Step-Download_EHB_Container-007BC2?style=for-the-badge&logo=githubactions&logoColor=white)](${jobUrl})

            ⚙️ **Container Build In Progress...**

            - **Current Step:** Download EHB container
            - **Task ID:** \`${taskId}\`
            - **Job Console:** [View Live Logs & Output](${jobUrl})`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            }

      - name: Authenticate for download
        id: auth-download
        uses: ./.github/actions/fetch-token
        with:
          client_id: ${{ secrets.DEMO_CLIENT_ID }}
          client_secret: ${{ secrets.DEMO_CLIENT_SECRET }}
          project_id: ${{ secrets.CLOUD_HUB_PROJECT_ID }}
          application_id: ${{ secrets.CLOUD_HUB_APPLICATION_ID }}
          auth_url: ${{ secrets.AUTH_URL }}

      - name: Download EHB container
        run: |
          TOKEN="${STEPS_AUTH_DOWNLOAD_OUTPUTS_TOKEN}"
          CURL_CONNECT_TIMEOUT=30
          CURL_MAX_TIME=300

          ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

          echo "[$(ts)] Downloading generated EHB container..."
          response=$(curl --location --insecure --request GET "${SELF_HREF}/container" \
            --connect-timeout "$CURL_CONNECT_TIMEOUT" \
            --max-time "$CURL_MAX_TIME" \
            --header 'accept: */*' \
            --header "Authorization: Bearer $TOKEN" \
            -o "${TASK_ID}.ehb" \
            --silent --show-error --write-out "HTTPSTATUS:%{http_code}")

          http_status="${response##*HTTPSTATUS:}"

          if [ "$http_status" -ne 200 ]; then
            echo "Error: Failed to download EHB container. Status code: $http_status"
            exit 1
          fi
        env:
          STEPS_AUTH_DOWNLOAD_OUTPUTS_TOKEN: ${{ steps.auth-download.outputs.token }}

      - name: Authenticate for delete
        id: auth-delete
        uses: ./.github/actions/fetch-token
        with:
          client_id: ${{ secrets.DEMO_CLIENT_ID }}
          client_secret: ${{ secrets.DEMO_CLIENT_SECRET }}
          project_id: ${{ secrets.CLOUD_HUB_PROJECT_ID }}
          application_id: ${{ secrets.CLOUD_HUB_APPLICATION_ID }}
          auth_url: ${{ secrets.AUTH_URL }}

      - name: Delete EHB container
        run: |
          TOKEN="${STEPS_AUTH_DELETE_OUTPUTS_TOKEN}"
          CURL_CONNECT_TIMEOUT=30
          CURL_MAX_TIME=180

          ts() { date -u +"%Y-%m-%dT%H:%M:%SZ"; }

          echo "[$(ts)] Deleting generated EHB container resource..."
          response=$(curl --location --request DELETE "${SELF_HREF}" \
            --connect-timeout "$CURL_CONNECT_TIMEOUT" \
            --max-time "$CURL_MAX_TIME" \
            --header 'accept: */*' \
            --header "Authorization: Bearer $TOKEN" \
            --silent --show-error --write-out "HTTPSTATUS:%{http_code}")

          http_status="${response##*HTTPSTATUS:}"

          if [ "$http_status" -ne 204 ]; then
            echo "Error: Failed to delete EHB container. Status code: $http_status"
            exit 1
          fi
        env:
          STEPS_AUTH_DELETE_OUTPUTS_TOKEN: ${{ steps.auth-delete.outputs.token }}

      - name: Update Issue Progress - Download Completed
        if: github.event.client_payload.issue_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const issueNumber = Number('${{ github.event.client_payload.issue_number }}');
            const taskId = '${{ env.TASK_ID }}';
            let jobUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              if (jobs.data.jobs.length > 0 && jobs.data.jobs[0].html_url) {
                jobUrl = jobs.data.jobs[0].html_url;
              }
            } catch (e) {}

            const marker = '<!-- ehb-progress-tracker -->';
            const body = `${marker}
            [![Step](https://img.shields.io/badge/Step-Deploy_EHB_Container_Artifact-007BC2?style=for-the-badge&logo=githubactions&logoColor=white)](${jobUrl})

            ⚙️ **Container Build In Progress...**

            - **Current Step:** Deploy EHB container artifact
            - **Task ID:** \`${taskId}\`
            - **Job Console:** [View Live Logs & Output](${jobUrl})`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            }

      - name: Deploy EHB container artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: EHANDBOOK Container
          path: ${{ env.TASK_ID }}.ehb
          retention-days: 5

      # ------------------------------------------------------------
      # On Success: Comment artifact link & Close Issue
      # ------------------------------------------------------------
      - name: Comment and Close Issue on Success
        if: success() && github.event.client_payload.issue_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const issueNumber = Number('${{ github.event.client_payload.issue_number }}');
            const taskId = '${{ env.TASK_ID }}';
            let jobUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              if (jobs.data.jobs.length > 0 && jobs.data.jobs[0].html_url) {
                jobUrl = jobs.data.jobs[0].html_url;
              }
            } catch (e) {}

            const marker = '<!-- ehb-progress-tracker -->';
            const body = `${marker}
            [![Status](https://img.shields.io/badge/Status-Completed-brightgreen?style=for-the-badge&logo=githubactions&logoColor=white)](${jobUrl})

            ✅ **EHANDBOOK Container Build Completed Successfully!**

            - **Task ID:** \`${taskId}\`
            - **Artifact:** The container has been uploaded to workflow artifacts.
            - **Artifact:** [Download EHANDBOOK Container](${artifactUrl})
            - **Job Console:** [View Logs & Output](${jobUrl})

            Closing this request.`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body
              });
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });

      # ------------------------------------------------------------
      # On Failure: Comment failure details
      # ------------------------------------------------------------
      - name: Comment on Issue on Failure
        if: failure() && github.event.client_payload.issue_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const issueNumber = Number('${{ github.event.client_payload.issue_number }}');
            let jobUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              if (jobs.data.jobs.length > 0 && jobs.data.jobs[0].html_url) {
                jobUrl = jobs.data.jobs[0].html_url;
              }
            } catch (e) {}

            const marker = '<!-- ehb-progress-tracker -->';
            const body = `${marker}
            [![Status](https://img.shields.io/badge/Status-Failed-red?style=for-the-badge&logo=githubactions&logoColor=white)](${jobUrl})

            ❌ **EHANDBOOK Container Build Failed.**

            Please check the workflow execution logs for error details:
            - **Job Console:** [View Live Logs & Output](${jobUrl})`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body
              });
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'not_planned'
            });