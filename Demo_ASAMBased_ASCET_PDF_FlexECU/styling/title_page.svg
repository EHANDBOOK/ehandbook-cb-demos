<!--
<#macro svgTspanLine text x y>
	<tspan x="${x}" y="${y}">${text}</tspan>
</#macro>

<#function wordwrap text width x y>
	<#assign returnValue>
		<#if (text?length > width)>
			<#local wrap = text?substring(0, width)?last_index_of(" ")>
			<#if wrap <= 0>
				<#local wrap=width>
			</#if>
			${text?substring(0, wrap)}<#lt>
			<#assign wrappedLine>
				${wordwrap(text?substring(wrap + 1), width, x, y)}<#lt>
			</#assign>
			<@svgTspanLine text=wrappedLine x=x y=y />
		<#else>
			${text}<#lt>
		</#if>
	</#assign>
	<#return returnValue>
</#function>

<#assign currentDate = .now>
<#assign DATE_TIME = currentDate?string["dd.MM.yyyy"]>
-->
